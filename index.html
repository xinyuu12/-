<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾宾浩斯记忆助手</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ========== RESET & BASE ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0d9488;--primary-light:#14b8a6;--primary-dark:#0f766e;
  --bg:#f8fafc;--surface:#fff;--text:#1e293b;--text-secondary:#64748b;
  --border:#e2e8f0;--danger:#ef4444;--warning:#f59e0b;--success:#10b981;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05);
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --sidebar-w:240px;--header-h:60px;
  --transition:0.2s cubic-bezier(.4,0,.2,1);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex}
a{color:var(--primary);text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,textarea,select{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

/* ========== SIDEBAR ========== */
.sidebar{
  width:var(--sidebar-w);height:100vh;position:fixed;left:0;top:0;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:100;transition:transform var(--transition);
}
.sidebar-logo{
  padding:20px 24px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);
}
.sidebar-logo .icon{width:40px;height:40px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.sidebar-logo h1{font-size:16px;font-weight:700;color:var(--text);line-height:1.3}
.sidebar-logo span{font-size:12px;color:var(--text-secondary);font-weight:400}
.sidebar-nav{flex:1;padding:12px 12px;overflow-y:auto}
.sidebar-nav .nav-section{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);padding:16px 12px 8px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:var(--radius-sm);color:var(--text-secondary);
  transition:all var(--transition);cursor:pointer;font-size:14px;font-weight:500;
  margin-bottom:2px;user-select:none;border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:#f1f5f9;color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.nav-item .nav-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.nav-item .badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:11px;
  padding:2px 8px;border-radius:10px;font-weight:600;min-width:22px;text-align:center;
}
.nav-item.active .badge{background:rgba(255,255,255,.3)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}

/* ========== MAIN ========== */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column}
.page-header{
  padding:20px 32px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;min-height:var(--header-h);
}
.page-header h2{font-size:22px;font-weight:700}
.page-content{flex:1;padding:24px 32px;overflow-y:auto;max-width:1200px;width:100%}

/* ========== CARDS ========== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:var(--surface);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;
  transition:transform var(--transition),box-shadow var(--transition);
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-icon{width:48px;height:48px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.stat-icon.blue{background:#eff6ff;color:#3b82f6}
.stat-icon.green{background:#ecfdf5;color:#10b981}
.stat-icon.orange{background:#fff7ed;color:#f97316}
.stat-icon.purple{background:#f5f3ff;color:#8b5cf6}
.stat-icon.red{background:#fef2f2;color:#ef4444}
.stat-info .stat-value{font-size:28px;font-weight:700;line-height:1}
.stat-info .stat-label{font-size:13px;color:var(--text-secondary);margin-top:4px}

.card{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px;margin-bottom:16px;
}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-header h3{font-size:16px;font-weight:600}

/* ========== BUTTONS ========== */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
  border-radius:var(--radius-xs);font-size:14px;font-weight:500;
  transition:all var(--transition);white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);box-shadow:var(--shadow)}
.btn-secondary{background:#f1f5f9;color:var(--text)}
.btn-secondary:hover{background:#e2e8f0}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:12px 24px;font-size:16px}
.btn-icon{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-xs)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ========== FORMS ========== */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);
  border-radius:var(--radius-xs);font-size:14px;transition:border-color var(--transition);
  background:var(--surface);color:var(--text);
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,148,136,.1);
}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ========== TABLE / LIST ========== */
.list-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:var(--surface);border-radius:var(--radius-sm);
  border:1px solid var(--border);margin-bottom:8px;
  transition:all var(--transition);
}
.list-item:hover{border-color:var(--primary-light);box-shadow:var(--shadow)}
.list-item .item-icon{width:40px;height:40px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.list-item .item-info{flex:1;min-width:0}
.list-item .item-title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .item-meta{font-size:12px;color:var(--text-secondary);display:flex;gap:12px;flex-wrap:wrap}
.list-item .item-actions{display:flex;gap:6px;flex-shrink:0}
.tag{
  display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;
}
.tag-teal{background:#ccfbf1;color:#0f766e}
.tag-blue{background:#dbeafe;color:#1d4ed8}
.tag-purple{background:#f3e8ff;color:#7c3aed}
.tag-orange{background:#ffedd5;color:#c2410c}
.tag-red{background:#fee2e2;color:#b91c1c}
.tag-green{background:#dcfce7;color:#15803d}

.importance-stars{color:#f59e0b;font-size:14px;letter-spacing:1px}

/* ========== PROFICIENCY ========== */
.proficiency-display{display:flex;align-items:center;gap:6px;min-width:100px}
.proficiency-bar-wrap{flex:1;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;max-width:80px}
.proficiency-fill{height:100%;border-radius:3px;transition:width .3s}
.proficiency-fill.low{background:linear-gradient(90deg,#ef4444,#f87171)}
.proficiency-fill.mid{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.proficiency-fill.high{background:linear-gradient(90deg,#10b981,#34d399)}
.proficiency-val{font-size:12px;font-weight:700;min-width:26px;text-align:center}
.proficiency-slider-wrap{display:flex;align-items:center;gap:8px}
.proficiency-slider-wrap input[type=range]{flex:1;accent-color:var(--primary)}
.proficiency-slider-wrap .prof-slider-val{font-size:14px;font-weight:700;min-width:32px;text-align:center;padding:2px 8px;border-radius:var(--radius-xs);transition:all var(--transition)}
.proficiency-slider-wrap .prof-slider-val.low{background:#fef2f2;color:#dc2626}
.proficiency-slider-wrap .prof-slider-val.mid{background:#fffbeb;color:#d97706}
.proficiency-slider-wrap .prof-slider-val.high{background:#f0fdf4;color:#059669}
.prof-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.prof-badge.low{background:#fee2e2;color:#b91c1c}
.prof-badge.mid{background:#fef3c7;color:#92400e}
.prof-badge.high{background:#d1fae5;color:#065f46}

/* ========== REVIEW LIST ========== */
.review-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-radius:var(--radius-sm);margin-bottom:8px;
  border:1px solid var(--border);background:var(--surface);
  transition:all var(--transition);
}
.review-item.overdue{border-left:4px solid var(--danger);background:#fef2f2}
.review-item.due-today{border-left:4px solid var(--warning)}
.review-item.completed-anim{opacity:.5;transform:scale(.98)}
.review-checkbox{
  width:24px;height:24px;border-radius:50%;border:2px solid #cbd5e1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;transition:all var(--transition);font-size:12px;color:transparent;
}
.review-checkbox:hover{border-color:var(--primary)}
.review-checkbox.done{background:var(--success);border-color:var(--success);color:#fff}

/* ========== AI COACH ========== */
.ai-input-area{
  background:var(--surface);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);margin-bottom:20px;
}
.ai-result-card{
  background:var(--surface);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow-md);border:2px solid var(--primary-light);
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.interval-row{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:#f8fafc;border-radius:var(--radius-xs);margin-bottom:6px;
}
.interval-round{font-weight:700;color:var(--primary);min-width:40px}
.interval-time{font-weight:600}
.interval-reason{font-size:12px;color:var(--text-secondary);margin-left:auto}
.ai-tip{padding:8px 12px;background:#f0fdfa;border-radius:var(--radius-xs);margin-bottom:4px;font-size:13px;display:flex;align-items:flex-start;gap:8px}

/* ========== CALENDAR ========== */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendar-day-header{text-align:center;font-size:12px;font-weight:600;color:var(--text-secondary);padding:8px}
.calendar-day{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:500;
  transition:all var(--transition);position:relative;min-height:48px;
}
.calendar-day:hover{background:#f1f5f9}
.calendar-day.other-month{color:#cbd5e1}
.calendar-day.today{border:2px solid var(--primary);font-weight:700}
.calendar-day .dot{
  width:6px;height:6px;border-radius:50%;background:var(--primary-light);
  position:absolute;bottom:6px;
}
.calendar-day .dot.many{background:var(--danger)}
.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.calendar-header button{background:none;border:none;font-size:20px;cursor:pointer;padding:4px 12px;border-radius:var(--radius-xs);color:var(--text)}
.calendar-header button:hover{background:#f1f5f9}

/* ========== MODAL ========== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}}
.modal{
  background:var(--surface);border-radius:var(--radius);padding:24px;
  width:90%;max-width:560px;max-height:85vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);animation:scaleIn .2s ease;
}
@keyframes scaleIn{from{transform:scale(.95);opacity:0}}
.modal h3{font-size:18px;font-weight:700;margin-bottom:20px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* ========== TOAST ========== */
.toast-container{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{
  padding:12px 20px;background:var(--surface);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lg);font-size:14px;font-weight:500;
  animation:slideIn .3s ease;display:flex;align-items:center;gap:8px;max-width:360px;
}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}}
.toast.success{border-left:4px solid var(--success)}
.toast.error{border-left:4px solid var(--danger)}

/* ========== EMPTY STATE ========== */
.empty-state{text-align:center;padding:48px 24px;color:var(--text-secondary)}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.empty-state h3{font-size:18px;font-weight:600;margin-bottom:4px;color:var(--text)}
.empty-state p{font-size:14px;margin-bottom:16px}

/* ========== SEARCH BAR ========== */
.search-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input,.search-bar select{
  padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-xs);
  font-size:14px;background:var(--surface);color:var(--text);
}
.search-bar input{flex:1;min-width:200px}
.search-bar input:focus,.search-bar select:focus{outline:none;border-color:var(--primary)}

/* ========== SETTINGS ========== */
.settings-section{margin-bottom:24px}
.settings-section h3{font-size:16px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.provider-tabs{display:flex;gap:4px;margin-bottom:16px}
.provider-tab{
  padding:8px 16px;border-radius:var(--radius-xs);font-size:14px;font-weight:500;
  cursor:pointer;background:#f1f5f9;color:var(--text-secondary);border:none;
  transition:all var(--transition);
}
.provider-tab.active{background:var(--primary);color:#fff}
.provider-tab:hover:not(.active){background:#e2e8f0}

/* ========== RESPONSIVE ========== */
@media(max-width:768px){
  .sidebar{
    position:fixed;bottom:0;left:0;width:100%;height:64px;top:auto;
    flex-direction:row;border-right:none;border-top:1px solid var(--border);
    padding:0;overflow-x:auto;
  }
  .sidebar-logo,.sidebar-footer,.nav-section{display:none}
  .sidebar-nav{display:flex;flex-direction:row;padding:4px 8px;gap:0}
  .nav-item{flex-direction:column;gap:2px;padding:6px 10px;font-size:10px;border-radius:0}
  .nav-item .nav-icon{font-size:20px;width:auto}
  .nav-item .badge{position:absolute;top:2px;right:2px;font-size:10px;padding:1px 6px}
  .main{margin-left:0;margin-bottom:72px}
  .page-header{padding:16px 20px}
  .page-header h2{font-size:18px}
  .page-content{padding:16px 20px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px;gap:10px}
  .stat-icon{width:36px;height:36px;font-size:18px}
  .stat-info .stat-value{font-size:22px}
  .form-row{grid-template-columns:1fr}
  .modal{width:95%;padding:16px}
}

/* ========== PRINT / DARK MODE PREP ========== */
.completed{text-decoration:line-through;opacity:.6}
.text-danger{color:var(--danger)}
.text-success{color:var(--success)}
.text-warning{color:var(--warning)}
.mt-4{margin-top:16px}
.mb-4{margin-bottom:16px}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.gap-2{display:flex;gap:8px}
.hidden{display:none!important}

/* ========== DAILY GOAL BAR ========== */
.daily-goal-bar{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:#f8fafc;border-radius:var(--radius-sm);margin-bottom:12px;
  flex-wrap:wrap;border:1.5px solid var(--border);
}
.daily-goal-bar .goal-label{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.goal-num-btn{
  padding:6px 14px;border-radius:16px;font-size:13px;font-weight:600;
  border:1.5px solid var(--border);background:var(--surface);color:var(--text);
  cursor:pointer;transition:all var(--transition);white-space:nowrap;
}
.goal-num-btn:hover{border-color:var(--primary);color:var(--primary)}
.goal-num-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:var(--shadow)}
.goal-num-btn.unlimited{font-size:12px}
.daily-goal-bar .goal-divider{width:1px;height:20px;background:var(--border)}
.daily-goal-bar .goal-hint{font-size:12px;color:var(--text-secondary)}
.collapsed-tasks-bar{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  background:#fffbeb;border:1.5px dashed var(--warning);border-radius:var(--radius-sm);
  cursor:pointer;transition:all var(--transition);margin-top:8px;font-size:13px;
  color:var(--text-secondary);user-select:none;
}
.collapsed-tasks-bar:hover{background:#fffbeb;border-color:#d97706;color:var(--text)}

/* ========== TASK PICKER MODAL ========== */
.task-pick-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:var(--radius-xs);margin-bottom:4px;
  border:1px solid var(--border);cursor:pointer;
  transition:all var(--transition);user-select:none;
}
.task-pick-item:hover{background:#f8fafc;border-color:var(--primary-light)}
.task-pick-item.selected{background:#f0fdfa;border-color:var(--primary)}
.task-pick-item .pick-checkbox{
  width:20px;height:20px;border-radius:var(--radius-xs);border:2px solid #cbd5e1;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all var(--transition);font-size:12px;color:transparent;
}
.task-pick-item.selected .pick-checkbox{background:var(--primary);border-color:var(--primary);color:#fff}
.task-pick-info{flex:1;min-width:0}
.task-pick-info .pick-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-pick-info .pick-meta{font-size:11px;color:var(--text-secondary);display:flex;gap:8px;flex-wrap:wrap}
.pick-summary{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
  padding:8px 12px;background:#f0fdfa;border-radius:var(--radius-sm);font-size:13px;font-weight:500;
}
.pick-summary .picked-count{font-weight:700;color:var(--primary);font-size:16px}
.pick-quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pick-quick-btns .btn{font-size:12px}
.pick-list-scroll{max-height:50vh;overflow-y:auto}
</style>
</head>
<body>

<!-- ========== SIDEBAR ========== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="icon">🧠</div>
    <div><h1>记忆助手</h1><span>艾宾浩斯记忆曲线</span></div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">主菜单</div>
    <button class="nav-item active" data-page="dashboard">
      <span class="nav-icon">📊</span> 仪表盘
      <span class="badge hidden" id="badge-dashboard">0</span>
    </button>
    <button class="nav-item" data-page="ai-coach">
      <span class="nav-icon">🤖</span> AI 教练
    </button>
    <button class="nav-item" data-page="content">
      <span class="nav-icon">📝</span> 内容管理
    </button>
    <div class="nav-section">视图</div>
    <button class="nav-item" data-page="calendar">
      <span class="nav-icon">📅</span> 日历视图
    </button>
    <button class="nav-item" data-page="stats">
      <span class="nav-icon">📈</span> 统计分析
    </button>
    <div class="nav-section">系统</div>
    <button class="nav-item" data-page="settings">
      <span class="nav-icon">⚙️</span> 设置
    </button>
  </nav>
  <div class="sidebar-footer">
    <div style="font-size:11px;color:var(--text-secondary);text-align:center">
      数据存储在本地浏览器<br>不会上传到任何服务器
    </div>
  </div>
</aside>

<!-- ========== MAIN ========== -->
<main class="main" id="main">

<!-- Dashboard -->

<script>
// ===================================================================
// 艾宾浩斯记忆助手 — 完整应用逻辑
// ===================================================================

// ========== CONSTANTS ==========
const DEFAULT_INTERVALS_HOURS = [0.083, 0.5, 12, 24, 48, 96, 168, 360];
const INTERVAL_LABELS = ['5分钟', '30分钟', '12小时', '1天', '2天', '4天', '7天', '15天'];
const DEFAULT_CATEGORIES = ['🏷️ 未分类', '📚 诗词古文', '🔤 外语单词', '📐 公式定理', '📋 专业知识', '🎯 其他'];
const STORAGE_KEY_CONTENT = 'ebbinghaus_content';
const STORAGE_KEY_SETTINGS = 'ebbinghaus_settings';
const STORAGE_KEY_CATEGORIES = 'ebbinghaus_categories';
const STORAGE_KEY_DAILY_PLAN = 'ebbinghaus_daily_plan';

// Dynamic categories (user-customizable)
function getCategories(){
  try{const c=JSON.parse(localStorage.getItem(STORAGE_KEY_CATEGORIES));if(Array.isArray(c)&&c.length>0)return c}catch(e){}
  return [...DEFAULT_CATEGORIES];
}
function saveCategories(cats){localStorage.setItem(STORAGE_KEY_CATEGORIES,JSON.stringify(cats))}

// ========== UTILS ==========
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fmtDate(d){const dd=new Date(d);return dd.toISOString().split('T')[0]}
function fmtDateTime(d){return new Date(d).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function fmtDateFull(d){return new Date(d).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}
function daysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/(86400000))}
function todayStr(){return fmtDate(new Date())}
function addHours(date,hours){return new Date(new Date(date).getTime()+hours*3600000)}
function isOverdue(dateStr){return dateStr < todayStr()}

// ========== DATA LAYER ==========
function loadContent(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY_CONTENT))||[]}catch(e){return[]}}
function saveContent(data){localStorage.setItem(STORAGE_KEY_CONTENT,JSON.stringify(data))}
function loadSettings(){
  const defaults={
    aiProvider:'claude',apiKey:'',apiUrl:'https://api.anthropic.com/v1/messages',
    model:'claude-sonnet-5-20251001',defaultIntervals:[...DEFAULT_INTERVALS_HOURS]
  };
  try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY_SETTINGS))||{};return{...defaults,...s}}
  catch(e){return defaults}
}
function saveSettings(s){localStorage.setItem(STORAGE_KEY_SETTINGS,JSON.stringify(s))}

function loadDailyPlan(){
  try{
    const plan=JSON.parse(localStorage.getItem(STORAGE_KEY_DAILY_PLAN));
    if(plan&&plan.date===todayStr()){
      // Ensure selectedTasks is always an array
      if(!Array.isArray(plan.selectedTasks))plan.selectedTasks=[];
      return plan;
    }
  }catch(e){}
  return{date:todayStr(),goal:0,selectedTasks:[]};
}
function saveDailyPlan(plan){localStorage.setItem(STORAGE_KEY_DAILY_PLAN,JSON.stringify(plan))}

// ========== EBBINGHAUS ENGINE ==========
function getIntervals(content){
  return (content.intervals&&content.intervals.length>0)?content.intervals:loadSettings().defaultIntervals;
}
function calculateReviewSchedule(content){
  const intervals=getIntervals(content);
  const created=new Date(content.createdAt);
  return intervals.map((h,i)=>({
    round:i+1,
    scheduledDate:fmtDate(addHours(created,h)),
    label:INTERVAL_LABELS[i]||`${h.toFixed(0)}小时`
  }));
}
function getReviewStatuses(content){
  const schedule=calculateReviewSchedule(content);
  const history=content.reviewHistory||[];
  return schedule.map(s=>{
    const done=history.find(h=>h.round===s.round&&h.status==='completed');
    let status='pending';
    if(done)status='completed';
    else if(isOverdue(s.scheduledDate))status='missed';
    else if(s.scheduledDate===todayStr())status='due_today';
    else if(s.scheduledDate>todayStr())status='upcoming';
    return{...s,status,completedDate:done?done.completedDate:null};
  });
}
function getTodayReviews(contentList){
  const today=todayStr();
  const reviews=[];
  contentList.forEach(c=>{
    const statuses=getReviewStatuses(c);
    statuses.forEach(s=>{
      if(s.status==='due_today'||s.status==='missed'){
        reviews.push({content:c,review:s});
      }
    });
  });
  reviews.sort((a,b)=>a.review.scheduledDate.localeCompare(b.review.scheduledDate));
  return reviews;
}
function getTotalReviewCount(contentList){
  let total=0,completed=0,missed=0;
  contentList.forEach(c=>{
    const statuses=getReviewStatuses(c);
    statuses.forEach(s=>{
      total++;
      if(s.status==='completed')completed++;
      if(s.status==='missed')missed++;
    });
  });
  return{total,completed,missed,pending:total-completed-missed};
}

// ========== DAILY PLAN ==========
function getTaskKey(contentId,round){return contentId+'-'+round}
function autoFillDailyPlan(todayReviews,goal){
  if(todayReviews.length===0||goal<=0)return[];
  // Sort: overdue first (oldest first), then due-today (by importance)
  const sorted=[...todayReviews].sort((a,b)=>{
    const aMissed=a.review.status==='missed'?1:0;
    const bMissed=b.review.status==='missed'?1:0;
    if(aMissed!==bMissed)return bMissed-aMissed;       // missed first
    if(aMissed&&bMissed)return a.review.scheduledDate.localeCompare(b.review.scheduledDate); // older missed first
    // Both due today: higher importance first
    return (b.content.importance||0)-(a.content.importance||0);
  });
  return sorted.slice(0,Math.min(goal,sorted.length)).map(tr=>({
    contentId:tr.content.id,
    round:tr.review.round
  }));
}
function isTaskSelected(plan,contentId,round){
  return plan.selectedTasks.some(t=>t.contentId===contentId&&t.round===round);
}
// Global: confirm picker selection
function taskPickerConfirm(){
  var s=window._tpState;if(!s)return;
  var plan=loadDailyPlan();
  plan.selectedTasks=[];
  Object.keys(s.selections).forEach(function(key){
    var parts=key.indexOf('|')>=0?key.split('|'):key.split('-');
    plan.selectedTasks.push({contentId:parts[0],round:parseInt(parts[1])});
  });
  saveDailyPlan(plan);
  closeModal();
  window._tpState=null;
  renderDashboard();
  updateBadge();
  showToast('已选择 '+plan.selectedTasks.length+' 个今日任务');
}
// Global: quick-select all
function taskPickerSelectAll(){
  var s=window._tpState;if(!s)return;
  s.selections={};
  for(var i=0;i<Math.min(s.effectiveGoal,s.todayReviews.length);i++){
    s.selections[getTaskKey(s.todayReviews[i].content.id,s.todayReviews[i].review.round)]=true;
  }
  _tpRefreshAll();
}
// Global: quick-select overdue first
function taskPickerSelectOverdue(){
  var s=window._tpState;if(!s)return;
  var sorted=[].concat(s.todayReviews).sort(function(a,b){
    if(a.review.status==='missed'&&b.review.status!=='missed')return -1;
    if(a.review.status!=='missed'&&b.review.status==='missed')return 1;
    return a.review.scheduledDate.localeCompare(b.review.scheduledDate);
  });
  s.selections={};
  for(var i=0;i<Math.min(s.effectiveGoal,sorted.length);i++){
    s.selections[getTaskKey(sorted[i].content.id,sorted[i].review.round)]=true;
  }
  _tpRefreshAll();
}
// Global: quick-select by importance
function taskPickerSelectImportance(){
  var s=window._tpState;if(!s)return;
  var sorted=[].concat(s.todayReviews).sort(function(a,b){return (b.content.importance||0)-(a.content.importance||0)});
  s.selections={};
  for(var i=0;i<Math.min(s.effectiveGoal,sorted.length);i++){
    s.selections[getTaskKey(sorted[i].content.id,sorted[i].review.round)]=true;
  }
  _tpRefreshAll();
}
// Global: quick-select by proficiency
function taskPickerSelectProficiency(){
  var s=window._tpState;if(!s)return;
  var sorted=[].concat(s.todayReviews).sort(function(a,b){return (a.content.proficiency||0)-(b.content.proficiency||0)});
  s.selections={};
  for(var i=0;i<Math.min(s.effectiveGoal,sorted.length);i++){
    s.selections[getTaskKey(sorted[i].content.id,sorted[i].review.round)]=true;
  }
  _tpRefreshAll();
}
// Global: clear all selections
function taskPickerClearAll(){
  var s=window._tpState;if(!s)return;
  s.selections={};
  _tpRefreshAll();
}
// Helper: refresh all item visuals (called by quick-select functions)
function _tpRefreshAll(){
  var s=window._tpState;if(!s)return;
  s.todayReviews.forEach(function(tr){
    var key=getTaskKey(tr.content.id,tr.review.round);
    var el=document.getElementById('pick-'+key);
    var cb=document.getElementById('pick-cb-'+key);
    if(s.selections[key]){
      if(el)el.classList.add('selected');
      if(cb){cb.textContent='✓';cb.style.background='var(--primary)';cb.style.borderColor='var(--primary)';cb.style.color='#fff';}
    }else{
      if(el)el.classList.remove('selected');
      if(cb){cb.textContent='';cb.style.background='';cb.style.borderColor='';cb.style.color='';}
    }
  });
  var n=Object.keys(s.selections).length;
  var c1=document.getElementById('pick-sel-count');if(c1)c1.textContent=n;
  var c2=document.getElementById('pick-confirm-btn');if(c2)c2.textContent='✅ 确认选择 ('+n+' 个)';
}
function taskPickerClick(el){
  var s=window._tpState;
  if(!s)return;
  var key=el.getAttribute('data-key');
  if(!key)return;
  // Toggle
  if(s.selections[key]){
    delete s.selections[key];
  }else{
    s.selections[key]=true;
  }
  // Update visuals
  if(s.selections[key]){
    el.classList.add('selected');
    var cb=el.querySelector('.pick-checkbox');
    if(cb){cb.textContent='✓';cb.style.background='var(--primary)';cb.style.borderColor='var(--primary)';cb.style.color='#fff';}
  }else{
    el.classList.remove('selected');
    var cb2=el.querySelector('.pick-checkbox');
    if(cb2){cb2.textContent='';cb2.style.background='';cb2.style.borderColor='';cb2.style.color='';}
  }
  // Update summary
  var n=Object.keys(s.selections).length;
  var c1=document.getElementById('pick-sel-count');if(c1)c1.textContent=n;
  var c2=document.getElementById('pick-confirm-btn');if(c2)c2.textContent='✅ 确认选择 ('+n+' 个)';
}
function openTaskPickerModal(){
  var content=loadContent();
  var todayReviews=getTodayReviews(content);
  var plan=loadDailyPlan();
  var goal=plan.goal||0;
  var effectiveGoal=goal>0?goal:todayReviews.length;

  var selections={};
  plan.selectedTasks.forEach(function(t){selections[getTaskKey(t.contentId,t.round)]=true});

  // Expose state globally so inline onclick + quick buttons can share it
  window._tpState={selections:selections,todayReviews:todayReviews,effectiveGoal:effectiveGoal};

  function renderPickerList(filteredReviews){
    return filteredReviews.map(function(tr){
      var c=tr.content;var r=tr.review;
      var key=getTaskKey(c.id,r.round);
      var sel=selections[key];
      var prof=c.proficiency||0;
      var profLvl=getProfLevel(prof);
      return'<div class="task-pick-item '+(sel?'selected':'')+'" data-key="'+key+'" id="pick-'+key+'" onclick="taskPickerClick(this)">'+
        '<div class="pick-checkbox" id="pick-cb-'+key+'">'+(sel?'✓':'')+'</div>'+
        '<div class="task-pick-info">'+
          '<div class="pick-title">'+escapeHtml(c.title)+'</div>'+
          '<div class="pick-meta">'+
            '<span>第'+r.round+'轮</span>'+
            '<span class="'+(r.status==='missed'?'text-danger':'')+'">'+(r.status==='missed'?'⚠️ 逾期':'📌 今天')+'</span>'+
            '<span>'+'⭐'.repeat(c.importance)+'</span>'+
            '<span class="prof-badge '+profLvl+'">熟练度 '+prof+'</span>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
  }

  openModal(
    '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'+
      '<div class="modal" style="max-width:640px">'+
        '<h3>📝 选择今日任务</h3>'+
        '<div class="pick-summary">'+
          '<span>已选择 <span class="picked-count" id="pick-sel-count">'+Object.keys(selections).length+'</span> / <span id="pick-goal-count">'+effectiveGoal+'</span> 个任务</span>'+
          (goal>0?'<span style="font-size:11px;color:var(--text-secondary)">今日目标: '+goal+' 个</span>':'<span style="font-size:11px;color:var(--text-secondary)">未设置目标 (显示全部)</span>')+
        '</div>'+
        '<div class="pick-quick-btns">'+
          '<button class="btn btn-sm btn-outline" onclick="taskPickerSelectAll()">✅ 全选 (上限'+effectiveGoal+')</button>'+
          '<button class="btn btn-sm btn-outline" onclick="taskPickerSelectOverdue()">⚠️ 逾期优先</button>'+
          '<button class="btn btn-sm btn-outline" onclick="taskPickerSelectImportance()">⭐ 重要性优先</button>'+
          '<button class="btn btn-sm btn-outline" onclick="taskPickerSelectProficiency()">🎯 熟练度优先</button>'+
          '<button class="btn btn-sm btn-outline" onclick="taskPickerClearAll()">🗑️ 清除选择</button>'+
        '</div>'+
        '<div class="pick-list-scroll" id="pick-list">'+
          (todayReviews.length===0?'<div class="empty-state"><div class="empty-icon">🎉</div><p>今天没有复习任务</p></div>':renderPickerList(todayReviews))+
        '</div>'+
        '<div class="modal-actions">'+
          '<button class="btn btn-outline" onclick="closeModal()">取消</button>'+
          '<button class="btn btn-primary" id="pick-confirm-btn" onclick="taskPickerConfirm()">✅ 确认选择 ('+Object.keys(selections).length+' 个)</button>'+
        '</div>'+
      '</div>'+
    '</div>'
  );

}

// ========== NAVIGATION ==========
function navigateTo(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const pageEl=document.getElementById('page-'+page);
  if(pageEl)pageEl.classList.remove('hidden');
  const navEl=document.querySelector(`[data-page="${page}"]`);
  if(navEl)navEl.classList.add('active');
  renderPage(page);
}
function renderPage(page){
  switch(page){
    case'dashboard':renderDashboard();break;
    case'ai-coach':renderAICoach();break;
    case'content':renderContentPage();break;
    case'calendar':renderCalendar();break;
    case'stats':renderStats();break;
    case'settings':renderSettings();break;
  }
}

// ========== TOAST ==========
function showToast(msg,type='success'){
  const container=document.getElementById('toast-container');
  const toast=document.createElement('div');
  toast.className=`toast ${type}`;
  toast.innerHTML=`${type==='success'?'✅':'❌'} ${msg}`;
  container.appendChild(toast);
  setTimeout(()=>{toast.style.opacity='0';toast.style.transition='opacity .3s';setTimeout(()=>toast.remove(),300)},2500);
}

// ========== MODAL ==========
function openModal(html){document.getElementById('modal-container').innerHTML=html}
function closeModal(){document.getElementById('modal-container').innerHTML=''}

// ========== CONTENT MODAL ==========
function openContentModal(editId=null,prefill=null){
  const content=editId?loadContent().find(c=>c.id===editId):null;
  const title=content?content.title:(prefill?prefill.title:'');
  const body=content?content.body:(prefill?prefill.body:'');
  const category=content?content.category:(prefill?prefill.category||getCategories()[0]:getCategories()[0]);
  const importance=content?content.importance:(prefill?prefill.importance||3:3);
  const intervals=content?(content.intervals||[]).join(','):'';
  const source=content?content.source:(prefill?prefill.source||'manual':'manual');
  const aiAdvice=content?content.aiAdvice:(prefill?prefill.aiAdvice||null:null);
  const proficiency=content?content.proficiency:(prefill?prefill.proficiency||0:0);

  const catOptions=getCategories().map(c=>`<option value="${c}" ${c===category?'selected':''}>${c}</option>`).join('');
  const starOptions=[1,2,3,4,5].map(v=>`<option value="${v}" ${v===importance?'selected':''}>${'⭐'.repeat(v)}</option>`).join('');

  openModal(`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${editId?'编辑内容':'添加学习内容'}</h3>
        <div class="form-group"><label>标题 *</label><input id="cf-title" value="${escapeHtml(title)}" placeholder="输入标题..."></div>
        <div class="form-group"><label>内容详情</label><textarea id="cf-body" placeholder="输入要记忆的内容...">${escapeHtml(body)}</textarea></div>
        <div class="form-row">
          <div class="form-group"><label>分类</label><select id="cf-category">${catOptions}</select></div>
          <div class="form-group"><label>重要性</label><select id="cf-importance">${starOptions}</select></div>
        </div>
        <div class="form-group"><label>自定义复习间隔（小时，逗号分隔，留空使用默认）</label><input id="cf-intervals" value="${intervals}" placeholder="留空=默认艾宾浩斯间隔"></div>
        ${source==='ai'&&aiAdvice?`<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">🤖 此内容由 AI 教练生成 · ${aiAdvice.contentType||''} · 难度:${aiAdvice.difficulty||'?'}</div>`:''}
        <div class="form-group"><label>🎯 熟练度 (0-10): <span id="prof-slider-label">${proficiency} 分</span></label>
          <div class="proficiency-slider-wrap">
            <span style="font-size:12px;color:var(--text-secondary)">0</span>
            <input type="range" id="cf-proficiency" min="0" max="10" value="${proficiency}" step="1" oninput="updateProfSlider(this)">
            <span style="font-size:12px;color:var(--text-secondary)">10</span>
            <span class="prof-slider-val" id="prof-slider-val-display">${proficiency}</span>
          </div>
          <span style="font-size:11px;color:var(--text-secondary)">0=完全不熟 5=基本掌握 10=完全精通</span>
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" id="cf-submit-btn">${editId?'保存修改':'添加内容'}</button>
        </div>
      </div>
    </div>
  `);

  document.getElementById('cf-submit-btn').onclick=()=>{
    const t=document.getElementById('cf-title').value.trim();
    if(!t){showToast('请输入标题','error');return}
    const b=document.getElementById('cf-body').value.trim();
    const cat=document.getElementById('cf-category').value;
    const imp=parseInt(document.getElementById('cf-importance').value);
    const prof=parseInt(document.getElementById('cf-proficiency').value);
    const rawInt=document.getElementById('cf-intervals').value.trim();
    let customIntervals=null;
    if(rawInt){
      customIntervals=rawInt.split(',').map(v=>parseFloat(v.trim())).filter(v=>!isNaN(v)&&v>=0);
      if(customIntervals.length===0){showToast('间隔格式错误，请输入数字用逗号分隔','error');return}
    }
    const list=loadContent();
    if(editId){
      const idx=list.findIndex(c=>c.id===editId);
      if(idx>=0){
        list[idx].title=t;list[idx].body=b;list[idx].category=cat;
        list[idx].importance=imp;list[idx].proficiency=prof;list[idx].source=source;
        if(customIntervals)list[idx].intervals=customIntervals;
        if(aiAdvice)list[idx].aiAdvice=aiAdvice;
      }
    }else{
      list.push({
        id:uid(),title:t,body:b,category:cat,importance:imp,proficiency:prof,
        intervals:customIntervals||[],source:source||'manual',
        aiAdvice:aiAdvice||null,createdAt:new Date().toISOString(),
        reviewHistory:[]
      });
    }
    saveContent(list);closeModal();
    showToast(editId?'内容已更新':'内容已添加');
    renderPage(document.querySelector('.nav-item.active')?.dataset?.page||'dashboard');
  };
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function updateProfSlider(slider){
  const val=parseInt(slider.value);
  const display=document.getElementById('prof-slider-val-display');
  const label=document.getElementById('prof-slider-label');
  if(display){
    display.textContent=val;
    display.className='prof-slider-val '+(val<=3?'low':val<=6?'mid':'high');
  }
  if(label)label.textContent=val+' 分';
}
function getProfLevel(v){return v<=3?'low':v<=6?'mid':'high'}
function getProfLabel(v){return v<=3?'生疏':v<=6?'一般':'熟练'}

// ========== DASHBOARD ==========
function renderDashboard(){
  var content=loadContent();
  var todayReviews=getTodayReviews(content);
  var allStats=getTotalReviewCount(content);
  var plan=loadDailyPlan();
  var goal=plan.goal||0;

  // Auto-fill if goal is set but no selections yet
  if(goal>0&&plan.selectedTasks.length===0){
    plan.selectedTasks=autoFillDailyPlan(todayReviews,goal);
    saveDailyPlan(plan);
  }

  // Determine visible tasks based on plan
  var selectedSet={};
  plan.selectedTasks.forEach(function(t){selectedSet[getTaskKey(t.contentId,t.round)]=true});

  // Filter: if selections exist, show selected only; else show all
  var visibleReviews,hiddenReviews;
  if(plan.selectedTasks.length>0){
    visibleReviews=todayReviews.filter(function(tr){return selectedSet[getTaskKey(tr.content.id,tr.review.round)]});
    hiddenReviews=todayReviews.filter(function(tr){return !selectedSet[getTaskKey(tr.content.id,tr.review.round)]});
  }else{
    visibleReviews=todayReviews;
    hiddenReviews=[];
  }

  // Stats
  var totalPending=todayReviews.filter(function(r){return r.review.status!=='completed'}).length;
  var visiblePending=visibleReviews.filter(function(r){return r.review.status!=='completed'}).length;
  var hiddenPending=hiddenReviews.filter(function(r){return r.review.status!=='completed'}).length;
  var completedToday=todayReviews.filter(function(r){return r.review.status==='completed'}).length;

  // Update badge (always show total pending)
  var badge=document.getElementById('badge-dashboard');
  if(totalPending>0){badge.textContent=totalPending;badge.classList.remove('hidden')}
  else{badge.classList.add('hidden')}

  // Calculate streak
  var streak=calculateStreak(content);

  // Average proficiency
  var avgProf=content.length>0?Math.round(content.reduce(function(s,c){return s+(c.proficiency||0)},0)/content.length*10)/10:0;

  // Goal buttons HTML
  var goalOptions=[3,5,8,10];
  var goalBtns=goalOptions.map(function(n){
    return '<button class="goal-num-btn'+(goal===n?' active':'')+'" onclick="setDailyGoal('+n+')">'+n+'</button>';
  }).join('');
  var unlimitedActive=goal===0?' active':'';

  function renderReviewItem(tr){
    var c=tr.content;var r=tr.review;
    var isDone=r.status==='completed';
    var isMissed=r.status==='missed';
    var prof=c.proficiency||0;
    var profLvl=getProfLevel(prof);
    return'<div class="review-item '+(isMissed?'overdue':r.status==='due_today'?'due-today':'')+' '+(isDone?'completed-anim':'')+'" id="review-'+c.id+'-'+r.round+'">'+
      '<div class="review-checkbox '+(isDone?'done':'')+'" onclick="toggleReview(\''+c.id+'\','+r.round+',this)" title="点击完成复习">'+(isDone?'✓':'')+'</div>'+
      '<div class="item-info">'+
        '<div class="item-title '+(isDone?'completed':'')+'">'+escapeHtml(c.title)+'</div>'+
        '<div class="item-meta">'+
          '<span>第'+r.round+'轮复习</span>'+
          '<span class="'+(isMissed?'text-danger':r.status==='due_today'?'text-warning':'')+'">📅 '+r.scheduledDate+' '+(isMissed?'⚠️ 已逾期':r.status==='due_today'?'📌 今天':'')+'</span>'+
          '<span>'+'⭐'.repeat(c.importance)+'</span>'+
          (c.source==='ai'?'<span class="tag tag-purple">🤖 AI</span>':'')+
        '</div>'+
      '</div>'+
      '<div class="proficiency-display" style="min-width:80px" title="熟练度 '+prof+'/10 · '+getProfLabel(prof)+'">'+
        '<div class="proficiency-bar-wrap" style="max-width:50px"><div class="proficiency-fill '+profLvl+'" style="width:'+prof*10+'%"></div></div>'+
        '<span class="prof-badge '+profLvl+'">'+prof+'</span>'+
      '</div>'+
      '<div class="item-actions">'+
        '<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();openContentModal(\''+c.id+'\')">📝</button>'+
      '</div>'+
    '</div>';
  }

  document.getElementById('dashboard-content').innerHTML=
    '<div class="stats-grid">'+
      '<div class="stat-card"><div class="stat-icon blue">📚</div><div class="stat-info"><div class="stat-value">'+content.length+'</div><div class="stat-label">总内容数</div></div></div>'+
      '<div class="stat-card"><div class="stat-icon '+(visiblePending>0?'orange':'green')+'">📋</div><div class="stat-info"><div class="stat-value">'+(goal>0&&plan.selectedTasks.length>0?visiblePending+'/'+totalPending:totalPending)+'</div><div class="stat-label">今日待复习</div></div></div>'+
      '<div class="stat-card"><div class="stat-icon purple">🔥</div><div class="stat-info"><div class="stat-value">'+streak+'</div><div class="stat-label">连续打卡天数</div></div></div>'+
      '<div class="stat-card"><div class="stat-icon '+(allStats.total>0&&allStats.completed/allStats.total>=0.8?'green':'red')+'">✅</div><div class="stat-info"><div class="stat-value">'+(allStats.total>0?Math.round(allStats.completed/allStats.total*100):0)+'%</div><div class="stat-label">总复习完成率</div></div></div>'+
      '<div class="stat-card"><div class="stat-icon '+(avgProf>=7?'green':avgProf>=4?'orange':'red')+'">🎯</div><div class="stat-info"><div class="stat-value">'+avgProf+'</div><div class="stat-label">平均熟练度 / 10</div></div></div>'+
    '</div>'+

    '<div class="card">'+
      '<div class="card-header"><h3>📋 今日复习任务 ('+todayStr()+')</h3>'+
        '<span style="font-size:13px;color:var(--text-secondary)">'+(goal>0&&plan.selectedTasks.length>0?visiblePending+' 条计划内 · ':totalPending+' 条待完成')+'</span>'+
      '</div>'+
      // Daily goal control bar
      '<div class="daily-goal-bar">'+
        '<span class="goal-label">🎯 今日目标:</span>'+
        goalBtns+
        '<button class="goal-num-btn unlimited'+unlimitedActive+'" onclick="setDailyGoal(0)">全部</button>'+
        '<span class="goal-divider"></span>'+
        (goal>0?
          '<button class="btn btn-sm btn-outline" onclick="openTaskPickerModal()">📝 选择任务 ('+plan.selectedTasks.length+')</button>'+
          '<span class="goal-hint">已完成 '+completedToday+' / '+goal+' 个</span>'
        :
          plan.selectedTasks.length>0?
            '<button class="btn btn-sm btn-outline" onclick="openTaskPickerModal()">📝 选择任务 ('+plan.selectedTasks.length+')</button>'+
            '<span class="goal-hint">已手动选择 '+plan.selectedTasks.length+' 个</span>'
          :
            '<button class="btn btn-sm btn-outline" onclick="openTaskPickerModal()">📝 选择任务</button>'
        )+
      '</div>'+
      // If goal set but no tasks match
      (goal>0&&plan.selectedTasks.length===0?
        '<div class="empty-state"><div class="empty-icon">🎯</div><h3>还没有选择今日任务</h3><p>点击上方"选择任务"按钮来挑选，或点击数字按钮自动填充</p></div>'
      // Review list
      :todayReviews.length===0?
        '<div class="empty-state"><div class="empty-icon">🎉</div><h3>今天没有复习任务</h3><p>去添加一些学习内容吧！</p><button class="btn btn-primary" onclick="openContentModal()">➕ 添加内容</button></div>'
      :visibleReviews.map(renderReviewItem).join('')+
      // Collapsed remaining tasks
      (hiddenReviews.length>0?
        '<div class="collapsed-tasks-bar" id="collapsed-tasks-bar" onclick="toggleCollapsedTasks()">'+
          '📋 还有 <strong>'+hiddenPending+'</strong> 条未加入今日计划 (共 '+hiddenReviews.length+' 条) <span style="font-size:11px">点击展开 ▾</span>'+
        '</div>'+
        '<div id="hidden-tasks-container" style="display:none">'+
          hiddenReviews.map(renderReviewItem).join('')+
        '</div>'
      :'')
    )+
    '</div>'+

    (content.length>0?
    '<div class="card">'+
      '<div class="card-header"><h3>📊 复习进度</h3></div>'+
      '<div style="background:#f1f5f9;border-radius:8px;height:24px;overflow:hidden">'+
        '<div style="width:'+(allStats.total>0?Math.round(allStats.completed/allStats.total*100):0)+'%;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));transition:width .5s;border-radius:8px"></div>'+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--text-secondary)">'+
        '<span>✅ 已完成 '+allStats.completed+'</span><span>❌ 已逾期 '+allStats.missed+'</span><span>⏳ 待复习 '+allStats.pending+'</span>'+
      '</div>'+
    '</div>':'')
  ;
}

// Helper: set daily goal
function setDailyGoal(n){
  var plan=loadDailyPlan();
  plan.goal=n;
  plan.selectedTasks=[];
  saveDailyPlan(plan);
  renderDashboard();
  updateBadge();
}
// Helper: toggle collapsed tasks
function toggleCollapsedTasks(){
  var container=document.getElementById('hidden-tasks-container');
  var bar=document.getElementById('collapsed-tasks-bar');
  if(container&&bar){
    if(container.style.display==='none'){
      container.style.display='block';
      bar.innerHTML=bar.innerHTML.replace('▾','▴');
    }else{
      container.style.display='none';
      bar.innerHTML=bar.innerHTML.replace('▴','▾');
    }
  }
}

function calculateStreak(contentList){
  let streak=0;
  const today=new Date();today.setHours(0,0,0,0);
  // Check backwards from today
  for(let i=0;i<365;i++){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const ds=fmtDate(d);
    // Check if any review was completed on this day
    let hasReview=false;
    contentList.forEach(c=>{
      (c.reviewHistory||[]).forEach(h=>{
        if(h.status==='completed'&&h.completedDate&&h.completedDate.startsWith(ds))hasReview=true;
      });
    });
    if(hasReview||i===0){if(hasReview)streak++;else if(i>0)break}
    else break;
  }
  return streak;
}

function toggleReview(contentId,round,checkboxEl){
  const list=loadContent();
  const idx=list.findIndex(c=>c.id===contentId);
  if(idx<0)return;
  const content=list[idx];
  // Check if already completed
  const existing=content.reviewHistory.find(h=>h.round===round&&h.status==='completed');
  if(existing){
    // Undo: remove the record
    content.reviewHistory=content.reviewHistory.filter(h=>!(h.round===round&&h.status==='completed'));
  }else{
    // Complete
    content.reviewHistory.push({round,status:'completed',completedDate:new Date().toISOString(),scheduledDate:fmtDate(new Date())});
  }
  saveContent(list);

  // Animate
  if(checkboxEl){
    if(!existing){
      checkboxEl.classList.add('done');checkboxEl.textContent='✓';
      const item=checkboxEl.closest('.review-item');
      if(item)item.classList.add('completed-anim');
    }else{
      checkboxEl.classList.remove('done');checkboxEl.textContent='';
      const item=checkboxEl.closest('.review-item');
      if(item)item.classList.remove('completed-anim');
    }
  }
  showToast(existing?'已撤销复习记录':'🎉 复习完成！继续加油！');
  setTimeout(()=>renderDashboard(),600);
  updateBadge();
}

function updateBadge(){
  const content=loadContent();
  const todayReviews=getTodayReviews(content);
  const pending=todayReviews.filter(r=>r.review.status!=='completed').length;
  const badge=document.getElementById('badge-dashboard');
  if(pending>0){badge.textContent=pending;badge.classList.remove('hidden')}
  else{badge.classList.add('hidden')}
}

  btn.disabled=true;btn.textContent='⏳ AI 分析中...';

  const sysPrompt=`你是一位专业的记忆训练教练，精通艾宾浩斯遗忘曲线和各类记忆技巧。
请分析用户输入的学习内容，给出专业的记忆方案。

async function callClaudeAPI(settings,sysPrompt,userPrompt){
  const resp=await fetch(settings.apiUrl,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':settings.apiKey,
      'anthropic-version':'2023-06-01'
    },
    body:JSON.stringify({
      model:settings.model,
      max_tokens:2048,
      system:sysPrompt,
      messages:[{role:'user',content:userPrompt}]
    })
  });
  if(!resp.ok){
    const err=await resp.text();
    let hint='';
    if(resp.status===401)hint=' → API Key 无效或已过期';
    else if(resp.status===403)hint=' → 无权访问该模型，请检查 API Key 权限';
    else if(resp.status===404)hint=' → 接口地址或模型名称错误';
    else if(resp.status===429)hint=' → 请求频率超限，请稍后重试';
    else if(resp.status===500)hint=' → API 服务器内部错误';
    throw new Error(`Claude API (${resp.status})${hint}: ${err.slice(0,200)}`);
  }
  const data=await resp.json();
  const text=data.content?.[0]?.text||'';
  // Try to parse JSON from response
  return parseAIResponse(text);
}

async function callOpenAIAPI(settings,sysPrompt,userPrompt){
  const resp=await fetch(settings.apiUrl,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':`Bearer ${settings.apiKey}`
    },
    body:JSON.stringify({
      model:settings.model,
      messages:[
        {role:'system',content:sysPrompt},
        {role:'user',content:userPrompt}
      ],
      temperature:0.7
    })
  });
  if(!resp.ok){
    const err=await resp.text();
    let hint='';
    if(resp.status===401)hint=' → API Key 无效或已过期';
    else if(resp.status===403)hint=' → 无权访问该模型，请检查 API Key 权限';
    else if(resp.status===404)hint=' → 接口地址或模型名称错误';
    else if(resp.status===429)hint=' → 请求频率超限，请稍后重试';
    else if(resp.status===500)hint=' → API 服务器内部错误';
    throw new Error(`API (${resp.status})${hint}: ${err.slice(0,200)}`);
  }
  const data=await resp.json();
  const text=data.choices?.[0]?.message?.content||'';
  return parseAIResponse(text);
}

function parseAIResponse(text){
  // Try direct parse first
  try{return JSON.parse(text)}catch(e){}
  // Try to extract JSON from markdown code block
  const match=text.match(/```(?:json)?\s*\n?([\s\S]*?)\n?```/);
  if(match){
    try{return JSON.parse(match[1])}catch(e){}
  }
  // Try to find JSON object
  const objMatch=text.match(/\{[\s\S]*\}/);
  if(objMatch){
    try{return JSON.parse(objMatch[0])}catch(e){}
  }
  throw new Error('无法解析 AI 返回的 JSON 格式');
}

function fillDemo(type){
  const ta=document.getElementById('bi-text');
  if(!ta)return;
  const sel=document.getElementById('bi-split-mode');
  const demos={
    numbered:"1. LeetCode 1 - Two Sum (两数之和)\n2. LeetCode 2 - Add Two Numbers (两数相加)\n3. LeetCode 3 - Longest Substring Without Repeating Characters\n4. LeetCode 4 - Median of Two Sorted Arrays\n5. LeetCode 5 - Longest Palindromic Substring\n6. LeetCode 10 - Regular Expression Matching\n7. LeetCode 20 - Valid Parentheses\n8. LeetCode 21 - Merge Two Sorted Lists\n9. LeetCode 23 - Merge k Sorted Lists\n10. LeetCode 42 - Trapping Rain Water",
    newline:"apple - 苹果\nbanana - 香蕉\ncherry - 樱桃\ndate - 枣子\nelderberry - 接骨木果\nfig - 无花果\ngrape - 葡萄\nhoneydew - 蜜瓜",
    comma:"abandon 放弃, abundant 丰富的, accommodate 容纳, demonstrate 演示, elaborate 详细的, fundamental 基础的, genuine 真正的, harmonious 和谐的"
  };
  ta.value=demos[type]||demos.numbered;
  if(sel&&type==='numbered')sel.value='numbered';
  else if(sel&&type==='newline')sel.value='newline';
  else if(sel&&type==='comma')sel.value='comma';
  if(sel)document.getElementById('bi-custom-sep-group').style.display=sel.value==='custom'?'block':'none';
  updateBatchPreview();
}

function parseItems(text,mode,customSep){
  if(!text.trim())return[];
  const trimmed=text.trim();

  if(mode==='auto'){
    // Try numbered first
    const numberedMatch=trimmed.match(/^\d+[\.\)、]\s/m);
    if(numberedMatch)return parseItems(trimmed,'numbered');
    // Try newline
    if(trimmed.includes('\n'))return parseItems(trimmed,'newline');
    // Try comma/semicolon
    if(/[,;，；、]/.test(trimmed))return parseItems(trimmed,'comma');
    // Single item
    return [trimmed];
  }

  let parts=[];
  switch(mode){
    case'numbered':
      // Match: 1. xxx, 2) xxx, 1、xxx, etc.
      parts=trimmed.split(/\n(?=\d+[\.\)\)、]\s*)/);
      parts=parts.map(p=>p.replace(/^\d+[\.\)\)、]\s*/,'').trim()).filter(Boolean);
      // If the first split didn't work (all on one line), try splitting by number patterns
      if(parts.length<=1){
        parts=trimmed.split(/(?:\s*[,;，；]?\s*)(?=\d+[\.\)\)、]\s*)/).map(p=>p.replace(/^\d+[\.\)\)、]\s*/,'').trim()).filter(Boolean);
      }
      break;
    case'newline':
      parts=trimmed.split(/\n+/).map(p=>p.trim()).filter(Boolean);
      break;
    case'comma':
      parts=trimmed.split(/[,;，；、]+/).map(p=>p.trim()).filter(Boolean);
      break;
    case'custom':
      if(!customSep)return[trimmed];
      // Escape regex special chars
      const escaped=customSep.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      parts=trimmed.split(new RegExp(escaped)).map(p=>p.trim()).filter(Boolean);
      break;
    default:
      parts=[trimmed];
  }
  return parts;
}

function updateBatchPreview(){
  const text=document.getElementById('bi-text')?.value||'';
  const mode=document.getElementById('bi-split-mode')?.value||'auto';
  const customSep=mode==='custom'?document.getElementById('bi-custom-sep')?.value||'':'';

  const items=parseItems(text,mode,customSep);
  const preview=document.getElementById('bi-preview');
  const count=document.getElementById('bi-count');
  const submitBtn=document.getElementById('bi-submit-btn');

  if(count)count.textContent=items.length;
  if(submitBtn)submitBtn.disabled=items.length===0;

  if(preview){

      preview.innerHTML=items.map((item,i)=>`

function executeBatchImport(){
  const text=document.getElementById('bi-text')?.value||'';

function renderCalendar(){
  const now=new Date();
  const year=now.getFullYear();
  const month=now.getMonth();
  renderCalendarMonth(year,month);
}

function renderCalendarMonth(year,month){
  const content=loadContent();
  // Build a map of date -> review count
  const dateMap={};
  content.forEach(c=>{
    const statuses=getReviewStatuses(c);
    statuses.forEach(s=>{
      if(!dateMap[s.scheduledDate])dateMap[s.scheduledDate]={total:0,pending:0};
      dateMap[s.scheduledDate].total++;
      if(s.status!=='completed')dateMap[s.scheduledDate].pending++;
    });
  });

  const firstDay=new Date(year,month,1).getDay();// 0=Sun
  const daysInMonth=new Date(year,month+1,0).getDate();
  const prevMonthDays=new Date(year,month,0).getDate();
  const today=todayStr();

  const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const dayHeaders=['日','一','二','三','四','五','六'];

  let cells='';
  // Previous month
  for(let i=firstDay-1;i>=0;i--){
    const d=prevMonthDays-i;
    const ds=fmtDate(new Date(year,month-1,d));
    cells+=`<div class="calendar-day other-month">${d}${dateMap[ds]?`<span class="dot ${dateMap[ds].pending>3?'many':''}"></span>`:''}</div>`;
  }
  // Current month
  for(let d=1;d<=daysInMonth;d++){
    const ds=fmtDate(new Date(year,month,d));
    const isToday=ds===today;
    const info=dateMap[ds];
    cells+=`<div class="calendar-day ${isToday?'today':''}" ${info?`onclick="showDayReviews('${ds}')" title="${info.pending}条待复习"`:''}>
      ${d}
      ${info?`<span class="dot ${info.pending>3?'many':''}"></span>`:''}
      ${info&&info.pending>0?`<span style="font-size:10px;color:var(--danger)">${info.pending}</span>`:''}
    </div>`;
  }
  // Next month
  const remaining=42-(firstDay+daysInMonth);// 6 rows of 7
  for(let d=1;d<=remaining;d++){
    const ds=fmtDate(new Date(year,month+1,d));
    cells+=`<div class="calendar-day other-month">${d}${dateMap[ds]?`<span class="dot ${dateMap[ds].pending>3?'many':''}"></span>`:''}</div>`;
  }

  document.getElementById('calendar-content').innerHTML=`
    <div class="card">
      <div class="calendar-header">
        <button onclick="renderCalendarMonth(${year},${month-1})">◀</button>
        <strong style="font-size:18px">${year}年 ${monthNames[month]}</strong>
        <button onclick="renderCalendarMonth(${year},${month+1})">▶</button>
        <button class="btn btn-sm btn-outline" onclick="renderCalendar()">今天</button>
      </div>
      <div class="calendar-grid">
        ${dayHeaders.map(d=>`<div class="calendar-day-header">${d}</div>`).join('')}
        ${cells}
      </div>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:12px;display:flex;gap:16px">
        <span>🔵 蓝点 = 有复习任务</span><span>🔴 红点 = 超过3条待复习</span><span>点击日期查看详情</span>
      </div>
    </div>
    <div id="day-review-detail"></div>
  `;
}

function renderForgettingCurve(){
  const canvas=document.getElementById('forgetting-curve-chart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');

  // Ebbinghaus formula: R = 100 * e^(-t/S)
  // Where S is memory strength (default ~1 for 1 day retention ~37%)
  const S=1;
  const days=Array.from({length:31},(_,i)=>i);// 0-30 days
  const naturalRetention=days.map(d=>Math.round(100*Math.exp(-d/S)));

  // With reviews at key points, retention resets
  const reviewPoints=[1,2,4,7,15];// days
  const withReviews=[...naturalRetention];
  reviewPoints.forEach(rp=>{
    for(let i=rp;i<withReviews.length;i++){
      withReviews[i]=Math.max(withReviews[i],Math.round(100*Math.exp(-(i-rp)/S)));
    }
  });

  new Chart(ctx,{
    type:'line',
    data:{
      labels:days.map(d=>d===0?'学习时':`${d}天`),
      datasets:[
        {
          label:'无复习 · 自然遗忘',
          data:naturalRetention,
          borderColor:'#ef4444',
          backgroundColor:'rgba(239,68,68,.1)',
          borderDash:[5,5],
          tension:.4,
          fill:false
        },
        {
          label:'有复习 · 记忆保持',
          data:withReviews,
          borderColor:'#0d9488',
          backgroundColor:'rgba(13,148,136,.1)',
          tension:.4,
          fill:true
        }
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{position:'bottom'}},
      scales:{
        y:{min:0,max:100,title:{display:true,text:'记忆保持率 (%)'}},
        x:{title:{display:true,text:'时间'}}
      }
    }
  });
}

function renderReviewPie(stats){
  const canvas=document.getElementById('review-pie-chart');
  if(!canvas)return;
  new Chart(canvas,{
    type:'doughnut',
    data:{
      labels:['已完成','已逾期','待复习'],
      datasets:[{
        data:[stats.completed,stats.missed,stats.pending],
        backgroundColor:['#10b981','#ef4444','#f59e0b'],
        borderWidth:2,borderColor:'#fff'
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{position:'bottom'}}
    }
  });
}

function renderCategoryStats(content){
  const catMap={};
  content.forEach(c=>{
    const cat=c.category||'未分类';
    if(!catMap[cat])catMap[cat]={count:0,importanceTotal:0};
    catMap[cat].count++;
    catMap[cat].importanceTotal+=c.importance;
  });
  const el=document.getElementById('category-stats');
  if(Object.keys(catMap).length===0){
    el.innerHTML='<div class="empty-state"><p>暂无数据</p></div>';
    return;
  }
  el.innerHTML=Object.entries(catMap).map(([cat,info])=>`
    <div class="list-item">
      <div class="item-info">
        <div class="item-title">${escapeHtml(cat)}</div>
        <div class="item-meta">${info.count} 条内容 · 平均重要性 ${(info.importanceTotal/info.count).toFixed(1)} ⭐</div>
      </div>
    </div>
  `).join('');
}

function renderProficiencyChart(content){
  const canvas=document.getElementById('proficiency-chart');
  if(!canvas)return;
  // Count items by proficiency level (0-10)
  const buckets=new Array(11).fill(0);
  content.forEach(c=>{
    const p=c.proficiency||0;
    if(p>=0&&p<=10)buckets[p]++;
  });
  const labels=buckets.map((_,i)=>i+'分');
  const bgColors=buckets.map((_,i)=>{
    if(i<=3)return '#ef4444';
    if(i<=6)return '#f59e0b';
    return '#10b981';
  });
  new Chart(canvas,{
    type:'bar',
    data:{
      labels,
      datasets:[{
        label:'内容数量',
        data:buckets,
        backgroundColor:bgColors,
        borderRadius:4,
        borderWidth:0
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>`${ctx.raw} 条内容`}}
      },
      scales:{
        y:{beginAtZero:true,title:{display:true,text:'内容数量'},ticks:{stepSize:1}},
        x:{title:{display:true,text:'熟练度'}}
      }
    }
  });
}

function switchProvider(provider){
  const defaults={
    claude:{url:'https://api.anthropic.com/v1/messages',model:'claude-sonnet-5-20251001'},
    openai:{url:'https://api.openai.com/v1/chat/completions',model:'gpt-4o'},
    deepseek:{url:'https://api.deepseek.com/chat/completions',model:'deepseek-chat'},
    custom:{url:'',model:''}
  };
  document.getElementById('s-api-url').value=defaults[provider].url;
  document.getElementById('s-model').value=defaults[provider].model;

  // Update URL hint
  const hints={
    claude:'Claude API 标准地址，无需修改',
    openai:'OpenAI 标准地址。注意：含 /v1 路径',
    deepseek:'DeepSeek 注意：无 /v1，直接 /chat/completions',
    custom:'输入你使用的 API 完整地址'
  };
  const hintEl=document.getElementById('api-url-hint');
  if(hintEl)hintEl.textContent=hints[provider]||'';

  // Update tabs
  document.querySelectorAll('.provider-tab').forEach(t=>t.classList.remove('active'));
  const targetTab=document.querySelector(`.provider-tab[data-provider="${provider}"]`);
  if(targetTab)targetTab.classList.add('active');

  // Update hidden state
  const s=loadSettings();s.aiProvider=provider;saveSettings(s);
}

// ========== CATEGORY MANAGEMENT ==========
function renderCategoryTags(){
  const el=document.getElementById('category-list-settings');
  if(!el)return;
  const cats=getCategories();
  el.innerHTML=cats.map(c=>`
    <span style="display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:#f1f5f9;border-radius:16px;font-size:13px">
      ${escapeHtml(c)}
      ${cats.length>1?`<button style="background:none;border:none;cursor:pointer;font-size:16px;line-height:1;color:var(--text-secondary);padding:0 2px" onclick="deleteCategory('${escapeHtml(c.replace(/'/g,"\\'"))}')" title="删除">×</button>`:''}
    </span>
  `).join('');
}
function addCategory(){
  const input=document.getElementById('s-new-category');
  if(!input)return;
  const name=input.value.trim();
  if(!name){showToast('请输入分类名称','error');return}
  const cats=getCategories();
  if(cats.includes(name)){showToast('该分类已存在','error');return}
  cats.push(name);
  saveCategories(cats);
  input.value='';
  renderCategoryTags();
  showToast(`分类「${name}」已添加`);
}
function deleteCategory(name){
  const cats=getCategories();
  if(cats.length<=1){showToast('至少保留一个分类','error');return}
  // Check if any content uses this category
  const contentWithCat=loadContent().filter(c=>c.category===name);
  if(contentWithCat.length>0){
    if(!confirm(`有 ${contentWithCat.length} 条内容使用分类「${name}」，删除后它们将变为「未分类」。确定删除？`))return;
    const list=loadContent();
    list.forEach(c=>{if(c.category===name)c.category='🏷️ 未分类';});
    saveContent(list);
  }
  saveCategories(cats.filter(c=>c!==name));
  renderCategoryTags();
  showToast(`分类「${name}」已删除`);
}
function resetCategories(){
  if(!confirm('确定恢复为默认分类？你自定义的分类将被覆盖。'))return;
  saveCategories([...DEFAULT_CATEGORIES]);
  renderCategoryTags();
  showToast('已恢复默认分类');
}

function saveAPISettings(){
  const s=loadSettings();
  s.apiKey=document.getElementById('s-api-key').value.trim();
  s.apiUrl=document.getElementById('s-api-url').value.trim();
  s.model=document.getElementById('s-model').value.trim();
  saveSettings(s);
  showToast('API 设置已保存');
}

async function testAPIConnection(){
  const apiKey=document.getElementById('s-api-key').value.trim();
  const apiUrl=document.getElementById('s-api-url').value.trim();
  const model=document.getElementById('s-model').value.trim();
  if(!apiKey||!apiUrl){showToast('请填写 API Key 和 API 地址','error');return}

  const resultEl=document.getElementById('test-result');
  const isFileProtocol=window.location.protocol==='file:';
  resultEl.innerHTML='⏳ 测试连接中...';

  // Warn about file:// protocol CORS issues
  if(isFileProtocol){
    resultEl.innerHTML=`
      <div style="background:#fffbeb;border:1px solid var(--warning);border-radius:var(--radius-xs);padding:12px;margin-bottom:8px">
        <strong>⚠️ 检测到你是直接打开 HTML 文件（file:// 协议）</strong><br>
        <span style="font-size:12px">浏览器会阻止来自本地文件的跨域请求。建议用以下方式启动本地服务器：</span>
        <div style="background:#1e293b;color:#e2e8f0;padding:8px 12px;border-radius:4px;margin:8px 0;font-family:monospace;font-size:12px">
          cd 艾宾浩斯记忆曲线<br>
          python -m http.server 8080<br>
          <span style="color:#94a3b8"># 然后访问 http://localhost:8080</span>
        </div>
        <span style="font-size:11px">或者用 npx: <code>npx serve .</code> | Node: <code>npx http-server -p 8080</code></span>
      </div>
      <span style="font-size:12px;color:var(--text-secondary)">仍然尝试连接中（部分浏览器可能允许）...</span>
    `;
  }

  try{
    const s=loadSettings();
    const resp=await fetch(apiUrl,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        ...(s.aiProvider==='claude'?{'x-api-key':apiKey,'anthropic-version':'2023-06-01'}:{'Authorization':`Bearer ${apiKey}`})
      },
      body:JSON.stringify(s.aiProvider==='claude'?{
        model:model,max_tokens:10,messages:[{role:'user',content:'Hi'}]
      }:{
        model:model,messages:[{role:'user',content:'Hi'}],max_tokens:10
      })
    });
    if(resp.ok){
      const data=await resp.json();
      resultEl.innerHTML=`
        <div style="background:#f0fdf4;border:1px solid var(--success);border-radius:var(--radius-xs);padding:12px">
          <strong style="color:var(--success)">✅ 连接成功！</strong>
          <span style="font-size:12px;color:var(--text-secondary)">模型: ${escapeHtml(model)} · 状态: ${resp.status}</span>
        </div>`;
    }else{
      const err=await resp.text();
      let hint='';
      if(resp.status===401)hint='<br><span style="font-size:12px;color:var(--danger)">→ API Key 无效或已过期，请检查</span>';
      else if(resp.status===403)hint='<br><span style="font-size:12px;color:var(--danger)">→ 权限不足，请检查 API Key 是否有访问该模型的权限</span>';
      else if(resp.status===404)hint='<br><span style="font-size:12px;color:var(--danger)">→ 接口地址或模型名称错误，请检查</span>';
      else if(resp.status===429)hint='<br><span style="font-size:12px;color:var(--warning)">→ 请求过于频繁，请稍后重试</span>';
      resultEl.innerHTML=`
        <div style="background:#fef2f2;border:1px solid var(--danger);border-radius:var(--radius-xs);padding:12px">
          <strong style="color:var(--danger)">❌ 连接失败 (HTTP ${resp.status})</strong>${hint}
          <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;word-break:break-all">${escapeHtml(err.slice(0,300))}</div>
        </div>`;
    }
  }catch(e){
    let hint='';
    const msg=e.message||'';
    if(msg.includes('Failed to fetch')||msg.includes('NetworkError')){
      if(isFileProtocol){
        hint='<br><span style="font-size:12px;color:var(--danger)">→ 最可能的原因：file:// 协议下浏览器阻止了跨域请求</span>';
        hint+='<br><span style="font-size:12px">→ 请按照上方提示启动本地 HTTP 服务器后再试</span>';
      }else{
        hint='<br><span style="font-size:12px;color:var(--danger)">→ 网络无法连接到 API 服务器</span>';
        hint+='<br><span style="font-size:12px">→ 可能原因：网络不通 / 被防火墙拦截 / 需要代理 / API 地址错误</span>';
        hint+='<br><span style="font-size:12px">→ 如果在国内使用 Claude/OpenAI 官方 API，可能需要代理或中转地址</span>';
      }
    }else if(msg.includes('CORS')){
      hint='<br><span style="font-size:12px;color:var(--danger)">→ CORS 跨域被拦截，请通过本地 HTTP 服务器访问此页面</span>';
    }
    resultEl.innerHTML=`
      <div style="background:#fef2f2;border:1px solid var(--danger);border-radius:var(--radius-xs);padding:12px">
        <strong style="color:var(--danger)">❌ 网络错误</strong>${hint}
        <div style="font-size:11px;color:var(--text-secondary);margin-top:4px">错误详情: ${escapeHtml(msg)}</div>
      </div>`;
  }
}

function saveDefaultIntervals(){
  const raw=document.getElementById('s-intervals').value.trim();
  const intervals=raw.split(',').map(v=>parseFloat(v.trim())).filter(v=>!isNaN(v)&&v>=0);
  if(intervals.length===0){showToast('请输入有效的间隔时间','error');return}
  const s=loadSettings();
  s.defaultIntervals=intervals;
  saveSettings(s);
  showToast('默认复习间隔已更新');
  renderSettings();
}

function exportData(){
  const data={content:loadContent(),settings:loadSettings(),exportDate:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`艾宾浩斯记忆数据_${todayStr()}.json`;a.click();
  showToast('数据已导出');
}

function importData(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.content||!Array.isArray(data.content))throw new Error('数据格式不正确');
      if(!confirm(`即将导入 ${data.content.length} 条内容。现有数据将被覆盖，确定继续？`))return;
      saveContent(data.content);
      if(data.settings)saveSettings(data.settings);
      showToast(`成功导入 ${data.content.length} 条内容`);
    }catch(err){
      showToast(`导入失败: ${err.message}`,'error');
    }
  };
  reader.readAsText(file);
  input.value='';
}

function clearAllData(){
  if(!confirm('⚠️ 确定要清除所有学习内容和复习记录吗？此操作不可恢复！'))return;
  if(!confirm('再次确认：清除所有数据？'))return;
  localStorage.removeItem(STORAGE_KEY_CONTENT);
  showToast('所有数据已清除');
  renderDashboard();
}

// ========== INIT ==========
function init(){
  // Handle sidebar navigation
  document.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click',function(){
      const page=this.dataset.page;
      if(page)navigateTo(page);
    });
  });

  // Close modal on overlay click
  document.getElementById('modal-container').addEventListener('click',function(e){
    if(e.target.classList.contains('modal-overlay'))closeModal();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')closeModal();
  });

  // Initial render
  renderDashboard();
  updateBadge();

  // Auto-refresh badge every minute
  setInterval(updateBadge,60000);
}

// Start app
document.addEventListener('DOMContentLoaded',init);
</script>
